<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roman Numerals Converter - Result</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ff6f61, #ff3d58);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    h2 {
      font-size: 26px;
      margin-bottom: 20px;
      color: #fff;
      text-transform: uppercase;
    }

    .result {
      color: #ff3d58;
      font-size: 36px;
      font-weight: bold;
      margin: 10px 0;
    }

    .footnote {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Roman Numerals Converter - Result</h2>
    <p>Number <span class="result">{{ number_decimal }}</span> equals <span class="result">{{ number_roman }}</span> in Roman Numerals.</p>

    <p class="footnote"><i>This app is developed in Python by Abraham and deployed with Flask on AWS EC2 Instance using AWS CloudFormation Service.</i></p>
  </div>
</body>

</html>
